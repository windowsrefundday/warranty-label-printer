name: Cross-platform verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies (macOS)
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.txt
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows.txt
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Audit tunnel dependency
        run: npm audit --audit-level=high
      - name: Install Python dependency audit tool
        run: python -m pip install pip-audit
      - name: Audit Python dependencies (macOS)
        if: runner.os != 'Windows'
        run: python -m pip_audit -r requirements.txt
      - name: Audit Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip_audit -r requirements-windows.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Verify Chromium launch
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<title>CI smoke test</title>")
              assert page.title() == "CI smoke test"
              browser.close()
          PY
      - name: Validate Windows helper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @("setup-windows.ps1", "run-windows.ps1", "warranty-windows.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "$script contains PowerShell syntax errors:"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Publication safety audit
        run: python tools/release_audit.py
      - name: Compile
        run: python -m compileall -q core interfaces main.py tests
      - name: Type check
        run: npm exec --no -- pyright
      - name: Read-only diagnostics
        run: python main.py --diagnose
