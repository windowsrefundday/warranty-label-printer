name: Managed application release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            requirements: requirements.txt
          - os: windows-2022
            target: windows-x86_64
            requirements: requirements-windows.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked application dependencies
        shell: bash
        run: |
          python -m venv --copies build/runtime
          if [[ -f build/runtime/Scripts/python.exe ]]; then RUNTIME_PYTHON=build/runtime/Scripts/python.exe; else RUNTIME_PYTHON=build/runtime/bin/python; fi
          "$RUNTIME_PYTHON" -m pip install --upgrade pip
          "$RUNTIME_PYTHON" -m pip install -r "${{ matrix.requirements }}"
          npm ci --omit=dev --ignore-scripts
      - name: Install bundled Chromium
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/browsers
        run: |
          if [[ -f build/runtime/Scripts/python.exe ]]; then RUNTIME_PYTHON=build/runtime/Scripts/python.exe; else RUNTIME_PYTHON=build/runtime/bin/python; fi
          "$RUNTIME_PYTHON" -m playwright install chromium
      - name: Build managed release artifact
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          if [[ -f build/runtime/Scripts/python.exe ]]; then RUNTIME_PYTHON=build/runtime/Scripts/python.exe; else RUNTIME_PYTHON=build/runtime/bin/python; fi
          "$RUNTIME_PYTHON" tools/package_release.py \
            --version "$VERSION" \
            --target "${{ matrix.target }}" \
            --runtime build/runtime \
            --browsers build/browsers \
            --node-modules node_modules \
            --output "dist/warranty-label-printer-${{ matrix.target }}.zip"
      - name: Upload build artifact for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-${{ matrix.target }}
          path: dist/warranty-label-printer-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install signing dependency
        run: python -m pip install --requirement requirements.txt
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: managed-*
          path: dist
          merge-multiple: true
      - name: Create draft release with immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "Warranty Label Printer $GITHUB_REF_NAME" --generate-notes
      - name: Sign and publish update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          test -n "$UPDATE_SIGNING_KEY_B64" || { echo "UPDATE_SIGNING_KEY_B64 is not configured" >&2; exit 1; }
          VERSION="${VERSION#v}"
          python tools/sign_manifest.py \
            --version "$VERSION" \
            --key-id release-2026-01 \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --asset windows-x86_64=dist/warranty-label-printer-windows-x86_64.zip \
            --asset macos-arm64=dist/warranty-label-printer-macos-arm64.zip \
            --output dist/update-manifest.json
          gh release upload "$GITHUB_REF_NAME" dist/update-manifest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
