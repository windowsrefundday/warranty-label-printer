name: Workflow security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "47 4 * * 1"

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly
          --workdir /repo
          rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          version: "1.25.2"
          advanced-security: ${{ github.event_name != 'pull_request' }}
